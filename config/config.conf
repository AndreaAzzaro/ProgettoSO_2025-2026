# Configurazione Mensa 'Oasi del Golfo' (Configurazione Realistica)

# Durata simulazione in giorni (settimana completa)
SIM_DURATION=3
# Durata di un pasto (servizio mensa) in minuti simulati - 4 ore per servizio completo
SIM_PASTO_DURATION=240
# Nanosecondi per minuto simulato (0.1ms reali = 1 min simulato) - TEST
NNANOSECS=100000

# --- Parametri Stazioni e Operatori ---
NOF_WORKERS=20
NOF_WK_SEATS_PRIMI=5
NOF_WK_SEATS_SECONDI=5
NOF_WK_SEATS_COFFEE=5
NOF_WK_SEATS_CASSA=5
NOF_TABLE_SEATS=100

# Tempi medi di servizio (in secondi simulati)
AVG_SRVC_PRIMI=2
AVG_SRVC_SECONDI=2
AVG_SRVC_COFFEE=1
AVG_SRVC_CASSA=2
AVG_SRVC_TICKET=1

# Pause
NOF_PAUSE=3

# --- Parametri Cibo e Refill ---
AVG_REFILL_PRIMI=100
AVG_REFILL_SECONDI=100
MAX_PORZIONI_PRIMI=200
MAX_PORZIONI_SECONDI=200
AVG_REFILL_TIME=5

# --- Parametri Utenti ---
NOF_USERS=40
OVERLOAD_THRESHOLD=100
QUEUE_PATIENCE_THRESHOLD=25
MAX_USERS_PER_GROUP=4

# --- Prezzi ---
PRICE_PRIMI=5
PRICE_SECONDI=7
PRICE_COFFEE=1

# --- Parametri Extra ---
STOP_DURATION=50
N_NEW_USERS=10
